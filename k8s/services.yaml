apiVersion: v1
kind: Service
metadata:
  name: kubernetes-api-demo-api-service
  labels:
    app:  kubernetes-api-demo
spec:
  selector:
    app:  kubernetes-api-demo
  ports:
    - protocol:  TCP
      port: 3000 # Service port
      targetPort: 3000 # Container port
  type: NodePort # Change it to load balancer if you're running in cloud