apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-api-demo-api
  labels:
    app: kubernetes-api-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-api-demo-api
  template:
    metadata:
      labels:
        app: kubernetes-api-demo-api
    spec:
      containers:
        - name: kubernetes-api-demo
          image: jai24k/kubernetes-api-demo-api
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20